<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>웹서비스 전체 흐름</title>
<style>
  :root {
    --ink: #1F2328; --sub: #6B7280; --line: #9CA3AF;
    --band-u: #F5F6F8; --band-s: #EEF1F7; --band-a: #F3F7F4; --band-f: #FAFAF7; --band-n: #F1F4FE;
    --node-stroke: #D1D5DB; --acc: #2F7D4F; --ch: #3B5BDB; --ch-stroke: #A5B4FC; --review: #F5B47A; --say: #3B5BDB;
  }
  body { margin: 0; background: #fff; font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; color: var(--ink); }
  .wrap { width: 1240px; padding: 24px 20px 8px; box-sizing: border-box; }
  h1 { font-size: 20px; margin: 0 0 2px 0; }
  p { font-size: 13px; color: var(--sub); margin: 0 0 8px 0; }
  svg text { font-family: inherit; }
  .t  { font-size: 14px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
  .s  { font-size: 11.5px; fill: var(--sub); text-anchor: middle; }
  .lane { font-size: 14px; font-weight: 700; fill: var(--ink); }
  .lane-s { font-size: 11px; fill: var(--sub); }
  .ph { font-size: 12.5px; font-weight: 700; fill: var(--sub); text-anchor: middle; }
  .ar { font-size: 11px; fill: var(--sub); }
  .btn { font-size: 12px; font-weight: 700; fill: var(--say); }
  .tag { font-size: 11px; font-weight: 700; fill: #C25E00; text-anchor: middle; }
  .chip { font-size: 12px; font-weight: 700; text-anchor: middle; }
  .node { fill: #fff; stroke: var(--node-stroke); stroke-width: 1.2; }
  .rv { fill: #fff; stroke: var(--review); stroke-width: 1.6; }
  .ai { fill: #fff; stroke: var(--acc); stroke-width: 1.6; }
  .nv { fill: #fff; stroke: var(--ch-stroke); stroke-width: 1.2; }
  .flow { stroke: var(--line); stroke-width: 1.6; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  .ic { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ic-ai { fill: var(--acc); }
  .ic-ext { fill: none; stroke: var(--ch); stroke-width: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>웹서비스 — 전체 흐름</h1>
  <p>단계별로 사용자 · 웹 서버 · AI · 네이버가 하는 일. 파란 글씨는 사용자가 누르는 버튼·요청, 맨 아래 띠는 product.json에 기록되는 상품 상태</p>

  <svg width="1200" height="585" viewBox="0 20 1200 585" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
      </marker>
      <g id="i-browser"><rect class="ic" x="1" y="3" width="18" height="14" rx="2"/><path class="ic" d="M1,7 H19"/><circle cx="4" cy="5" r=".8" fill="#1F2328"/><circle cx="6.5" cy="5" r=".8" fill="#1F2328"/></g>
      <g id="i-server"><rect class="ic" x="2" y="2" width="16" height="7" rx="1.5"/><rect class="ic" x="2" y="11" width="16" height="7" rx="1.5"/><circle cx="5.5" cy="5.5" r="1" fill="#1F2328"/><circle cx="5.5" cy="14.5" r="1" fill="#1F2328"/></g>
      <g id="i-ai"><path class="ic-ai" d="M10 1l2.2 6.8L19 10l-6.8 2.2L10 19l-2.2-6.8L1 10l6.8-2.2z"/></g>
      <g id="i-folder"><path class="ic" d="M1.5,5 V16 H18.5 V7 H9.5 L8,5 Z"/></g>
      <g id="i-cloud"><path class="ic-ext" d="M6,16 H15 a4,4 0 0 0 0-8 a5,5 0 0 0-9.5,1.5 A3.3,3.3 0 0 0 6,16 Z"/></g>
    </defs>

    <!-- 단계 -->
    <text class="ph" x="220" y="44">① 정보 입력</text>
    <text class="ph" x="520" y="44">② 작성 · 검토</text>
    <text class="ph" x="830" y="44">③ 네이버 등록</text>
    <text class="ph" x="1070" y="44">④ 판매 공개</text>
    <line x1="320" y1="34" x2="320" y2="600" stroke="#E5E7EB" stroke-dasharray="3 4"/>
    <line x1="720" y1="34" x2="720" y2="600" stroke="#E5E7EB" stroke-dasharray="3 4"/>
    <line x1="945" y1="34" x2="945" y2="600" stroke="#E5E7EB" stroke-dasharray="3 4"/>

    <!-- 레인 -->
    <rect x="0" y="60"  width="1190" height="110" rx="12" fill="var(--band-u)"/>
    <rect x="0" y="185" width="1190" height="125" rx="12" fill="var(--band-s)"/>
    <rect x="0" y="325" width="1190" height="105" rx="12" fill="var(--band-a)"/>
    <rect x="0" y="530" width="1190" height="70"  rx="12" fill="var(--band-f)"/>
    <rect x="0" y="445" width="1190" height="70"  rx="12" fill="var(--band-n)"/>
    <use href="#i-browser" x="16" y="98"/><text class="lane" x="42" y="113">사용자</text><text class="lane-s" x="42" y="130">브라우저</text>
    <use href="#i-server" x="16" y="230"/><text class="lane" x="42" y="245">웹 서버</text><text class="lane-s" x="42" y="262">작업 관리</text>
    <use href="#i-ai" x="16" y="360"/><text class="lane" x="42" y="375">AI</text><text class="lane-s" x="42" y="392">Codex</text>
    <use href="#i-folder" x="16" y="547"/><text class="lane" x="42" y="562">상태</text><text class="lane-s" x="42" y="579">product.json</text>
    <use href="#i-cloud" x="16" y="468"/><text class="lane" x="42" y="484" style="fill:var(--ch)">네이버</text>

    <!-- 사용자 -->
    <rect class="node" x="140" y="85" width="160" height="65" rx="10"/>
    <text class="t" x="220" y="112">정보 입력</text><text class="s" x="220" y="132">사진 · 매입가 · 상세 요청</text>
    <rect class="rv" x="420" y="85" width="220" height="65" rx="10"/>
    <text class="tag" x="530" y="78">검토 1</text>
    <text class="t" x="530" y="112">검토</text><text class="s" x="530" y="132">섹션 확인 · 수정 요청 · 질문 답</text>
    <rect class="rv" x="970" y="85" width="200" height="65" rx="10"/>
    <text class="tag" x="1070" y="78">검토 2</text>
    <text class="t" x="1070" y="112">판매자센터 확인</text><text class="s" x="1070" y="132">실제 등록 상태 · 고객 화면</text>

    <!-- 웹 서버 -->
    <rect class="node" x="140" y="215" width="160" height="65" rx="10"/>
    <text class="t" x="220" y="242">상품 폴더 생성</text><text class="s" x="220" y="262">사진 · 입력값 저장</text>
    <rect class="node" x="340" y="215" width="170" height="65" rx="10"/>
    <text class="t" x="425" y="242">AI 작업 요청</text><text class="s" x="425" y="262">대기열 · 진행 감시</text>
    <rect class="node" x="530" y="215" width="170" height="65" rx="10"/>
    <text class="t" x="615" y="242">후처리</text><text class="s" x="615" y="262">검사 · 미리보기 · 상세 이미지</text>
    <rect class="node" x="740" y="215" width="180" height="65" rx="10"/>
    <text class="t" x="830" y="242">비공개 등록</text><text class="s" x="830" y="262">등록 · 저장값 비교</text>
    <rect class="node" x="970" y="215" width="200" height="65" rx="10"/>
    <text class="t" x="1070" y="242">판매 공개</text><text class="s" x="1070" y="262">전시중지 → 전시중</text>

    <!-- AI -->
    <rect class="ai" x="340" y="345" width="170" height="70" rx="10"/>
    <text class="t" x="425" y="372">작성 · 수정</text><text class="s" x="425" y="393">사진 · 카테고리 · 상품명 · 상세</text>

    <!-- 상태 띠 -->
    <g>
      <rect x="170" y="549" width="100" height="30" rx="15" fill="#fff" stroke="#D1D5DB"/><text class="chip" x="220" y="569" style="fill:#6B7280">입력</text>
      <rect x="375" y="549" width="100" height="30" rx="15" fill="#fff" stroke="#C9C2F5"/><text class="chip" x="425" y="569" style="fill:#5b4be0">작성 중</text>
      <rect x="565" y="549" width="100" height="30" rx="15" fill="#fff" stroke="#F5B47A"/><text class="chip" x="615" y="569" style="fill:#C25E00">검토</text>
      <rect x="770" y="549" width="120" height="30" rx="15" fill="#fff" stroke="#A5B4FC"/><text class="chip" x="830" y="569" style="fill:#3B5BDB">비공개 등록</text>
      <rect x="1020" y="549" width="100" height="30" rx="15" fill="#fff" stroke="#9BD3B0"/><text class="chip" x="1070" y="569" style="fill:#00a03a">판매 중</text>
      <path class="flow" d="M270,564 H373" marker-end="url(#arw)"/>
      <path class="flow" d="M475,564 H563" marker-end="url(#arw)"/>
      <path class="flow" d="M665,564 H768" marker-end="url(#arw)"/>
      <path class="flow" d="M890,564 H1018" marker-end="url(#arw)"/>
    </g>

    <!-- 네이버 -->
    <rect class="nv" x="340" y="458" width="170" height="50" rx="10"/>
    <text class="t" x="425" y="479" style="fill:var(--ch)">쇼핑인사이트</text><text class="s" x="425" y="497">수요 · 키워드 조회</text>
    <rect class="nv" x="740" y="458" width="180" height="50" rx="10"/>
    <text class="t" x="830" y="479" style="fill:var(--ch)">스마트스토어</text><text class="s" x="830" y="497">비공개 상태로 등록</text>
    <rect class="nv" x="970" y="458" width="200" height="50" rx="10"/>
    <text class="t" x="1070" y="479" style="fill:var(--ch)">판매 시작</text><text class="s" x="1070" y="497">고객에게 노출</text>

    <!-- 화살표 ① -->
    <path class="flow" d="M220,150 V213" marker-end="url(#arw)"/>
    <text class="btn" x="228" y="188">AI 작성 시작</text>
    <path class="flow" d="M300,247 H338" marker-end="url(#arw)"/>

    <!-- ② -->
    <path class="flow" d="M425,280 V343" marker-end="url(#arw)"/>
    <text class="ar" x="433" y="316">요청</text>
    <path class="flow" d="M510,380 H615 V282" marker-end="url(#arw)"/>
    <text class="ar" x="522" y="372">작성 완료</text>
    <path class="flow" d="M615,215 V152" marker-end="url(#arw)"/>
    <text class="ar" x="623" y="188">미리보기 갱신</text>
    <path class="flow dash" d="M460,150 V213" marker-end="url(#arw)"/>
    <text class="btn" x="336" y="180">수정 요청</text>
    <text class="btn" x="336" y="196">질문 답</text>
    <path class="flow dash" d="M425,415 V456" marker-start="url(#arw)" marker-end="url(#arw)"/>
    <text class="ar" x="433" y="440">조회</text>

    <!-- ③ -->
    <path class="flow" d="M640,117 H830 V213" marker-end="url(#arw)"/>
    <text class="btn" x="660" y="109">비공개 등록</text>
    <path class="flow" d="M830,280 V456" marker-start="url(#arw)" marker-end="url(#arw)"/>
    <text class="ar" x="838" y="440">등록 · 조회</text>
    <path class="flow" d="M920,247 H945 V117 H968" marker-end="url(#arw)"/>
    <text class="ar" x="950" y="190">바로가기</text>

    <!-- ④ -->
    <path class="flow" d="M1070,150 V213" marker-end="url(#arw)"/>
    <text class="btn" x="1078" y="188">판매 공개</text>
    <path class="flow" d="M1070,280 V456" marker-end="url(#arw)"/>
  </svg>
</div>
</body>
</html>
