<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>웹서비스 아키텍처</title>
<style>
  :root {
    --ink: #1F2328; --sub: #6B7280; --line: #9CA3AF;
    --pc: #F5F6F8; --srv: #EEF1F7; --files: #FAFAF7;
    --node-stroke: #D1D5DB; --acc: #2F7D4F; --ch: #3B5BDB; --ch-stroke: #A5B4FC;
  }
  body { margin: 0; background: #fff; font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; color: var(--ink); }
  .wrap { width: 1190px; padding: 24px 20px 8px; box-sizing: border-box; }
  h1 { font-size: 20px; margin: 0 0 2px 0; }
  p { font-size: 13px; color: var(--sub); margin: 0 0 8px 0; }
  svg text { font-family: inherit; }
  .t  { font-size: 14px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
  .tl { font-size: 15px; font-weight: 700; fill: var(--ink); }
  .s  { font-size: 12px; fill: var(--sub); text-anchor: middle; }
  .sl { font-size: 12px; fill: var(--sub); }
  .ar { font-size: 11px; fill: var(--sub); }
  .scr { font-size: 12.5px; fill: var(--ink); text-anchor: middle; }
  .cap { font-size: 11px; fill: var(--sub); }
  .node { fill: #fff; stroke: var(--node-stroke); stroke-width: 1.2; }
  .pill { fill: #F7F8FA; stroke: #E2E4E8; stroke-width: 1; }
  .ai { fill: #fff; stroke: var(--acc); stroke-width: 1.6; }
  .alt { fill: #fff; stroke: #9CA3AF; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .ext { fill: #fff; stroke: var(--ch-stroke); stroke-width: 1.2; }
  .flow { stroke: var(--line); stroke-width: 1.6; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  .ic { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ic-ai { fill: var(--acc); }
  .ic-ext { fill: none; stroke: var(--ch); stroke-width: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>웹서비스 — 아키텍처</h1>
  <p>왼쪽부터 사용자 화면 → 웹 서버 → AI · 스크립트 → 외부 서비스. 아래는 모두가 함께 읽고 쓰는 작업공간 파일<br>기존 Codex 앱 방식은 브라우저 · 웹 서버 · Codex app-server 자리를 Codex 앱 하나가 대신하고, scripts · 작업공간 파일 · 외부 서비스는 같이 사용 (그림에서 생략)</p>

      <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
      </marker>
      <!-- 아이콘 (20x20) -->
      <g id="i-browser"><rect class="ic" x="1" y="3" width="18" height="14" rx="2"/><path class="ic" d="M1,7 H19"/><circle cx="4" cy="5" r=".8" fill="#1F2328"/><circle cx="6.5" cy="5" r=".8" fill="#1F2328"/></g>
      <g id="i-server"><rect class="ic" x="2" y="2" width="16" height="7" rx="1.5"/><rect class="ic" x="2" y="11" width="16" height="7" rx="1.5"/><circle cx="5.5" cy="5.5" r="1" fill="#1F2328"/><circle cx="5.5" cy="14.5" r="1" fill="#1F2328"/></g>
      <g id="i-ai"><path class="ic-ai" d="M10 1l2.2 6.8L19 10l-6.8 2.2L10 19l-2.2-6.8L1 10l6.8-2.2z"/></g>
      <g id="i-term"><rect class="ic" x="1" y="3" width="18" height="14" rx="2"/><path class="ic" d="M5,8 L8,10 L5,12 M10,12 H14"/></g>
      <g id="i-folder"><path class="ic" d="M1.5,5 V16 H18.5 V7 H9.5 L8,5 Z"/></g>
      <g id="i-pc"><rect class="ic" x="2" y="3" width="16" height="11" rx="1.5"/><path class="ic" d="M7,18 H13 M10,14 V18"/></g>
      <g id="i-cloud"><path class="ic-ext" d="M6,16 H15 a4,4 0 0 0 0-8 a5,5 0 0 0-9.5,1.5 A3.3,3.3 0 0 0 6,16 Z"/></g>
    </defs>

    <rect class="pill" x="44" y="148" width="132" height="34" rx="6"/><text class="scr" x="110" y="170">① 정보 입력</text>
    <rect class="pill" x="44" y="188" width="132" height="34" rx="6"/><text class="scr" x="110" y="210">② 작성 · 검토</text>
    <rect class="pill" x="44" y="228" width="132" height="34" rx="6"/><text class="scr" x="110" y="250">③ 네이버 등록</text>
    <rect class="pill" x="44" y="268" width="132" height="34" rx="6"/><text class="scr" x="110" y="290">④ 판매 공개</text>

    <rect class="pill" x="44" y="372" width="132" height="34" rx="6"/><text class="scr" x="110" y="394">설정 · 로그인</text>
    <text class="s" x="110" y="504">버튼 · 요청 칸만 사용</text>
    <text class="s" x="110" y="522">채팅창 없음</text>

    <text class="t" x="306" y="148">app.py</text><text class="s" x="306" y="167">화면 · API</text>

    <text class="tl" x="622" y="110">Codex app-server</text>
    <text class="sl" x="596" y="138">ChatGPT 데스크톱 앱 내장</text>

    <!-- 스크립트 -->

    <use href="#i-term" x="596" y="224"/>

    <text class="sl" x="596" y="268">검사 · 가격 계산 · 이미지 변환</text>
    <text class="sl" x="596" y="290">미리보기 · 상세 이미지 생성</text>
    <text class="sl" x="596" y="312">네이버 등록 · 쇼핑인사이트 조회</text>

    <!-- 작업공간 파일 -->
    <rect x="220" y="370" width="596" height="180" rx="12" fill="var(--files)" stroke="#D6D3C4"/>
    <use href="#i-folder" x="236" y="384"/>
    <text class="tl" x="262" y="400">작업공간 파일</text><text class="cap" x="364" y="400">plant-agent/ · 저장소 역할 (별도 DB 없음)</text>
    <rect class="node" x="236" y="418" width="190" height="114" rx="8"/>
    <text class="t" x="331" y="456">상품</text>
    <text class="s" x="331" y="480">product.json (단일 기준)</text>
    <text class="s" x="331" y="500">사진 · 상세페이지</text>
    <rect class="node" x="438" y="418" width="190" height="114" rx="8"/>
    <text class="t" x="533" y="456">작성 기준 · 지침</text>
    <text class="s" x="533" y="480">작성기준.md</text>
    <text class="s" x="533" y="500">AGENTS · SKILL</text>
    <rect class="node" x="640" y="418" width="160" height="114" rx="8"/>
    <text class="t" x="720" y="456">설정</text>
    <text class="s" x="720" y="480">스토어 기본값</text>
    <text class="s" x="720" y="500">API 키 (깃 제외)</text>

    <!-- 외부 서비스 -->
    <rect x="878" y="40" width="262" height="560" rx="14" fill="#F1F4FE"/>

    <text class="tl" x="920" y="65" style="font-size:14px">외부 서비스</text><text class="cap" x="1006" y="65">인터넷</text>
    <rect class="ext" x="898" y="80" width="222" height="110" rx="10"/>
    <text class="t" x="1009" y="128" style="fill:var(--ch)">OpenAI</text>
    <text class="s" x="1009" y="150">ChatGPT 요금제 (클라이언트 계정)</text>
    <rect class="ext" x="898" y="210" width="222" height="55" rx="10"/>
    <text class="t" x="1009" y="234" style="fill:var(--ch)">네이버 커머스API</text>
    <text class="s" x="1009" y="253">상품 등록 · 공개 (IP 등록)</text>
    <rect class="ext" x="898" y="275" width="222" height="55" rx="10"/>
    <text class="t" x="1009" y="299" style="fill:var(--ch)">네이버 API HUB</text>
    <text class="s" x="1009" y="318">쇼핑인사이트</text>
    <rect class="ext" x="898" y="495" width="222" height="55" rx="10"/>

    <text class="s" x="1009" y="538">최종 확인</text>

    <path class="flow" d="M190,152 H234" marker-start="url(#arw)" marker-end="url(#arw)"/>

    <text class="ar" x="856" y="324" text-anchor="middle">데이터</text>

    <text class="ar" x="566" y="354">읽기·쓰기</text>

    <path class="flow dash" d="M110,550 V580 H861 V522 H896" marker-end="url(#arw)"/>
    <text class="ar" x="440" y="574">판매자센터 바로가기 (새 탭)</text>
  </svg>
</div>
</body>
</html>
